name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swiftc --version

      - name: Build app bundle
        run: ./build.sh

      - name: Verify self-test
        run: |
          "./DeepSeek Balance.app/Contents/MacOS/DeepSeekBalance" --selftest || true

      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "DeepSeek Balance.app" "dist/DeepSeek-Balance-macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Balance-macOS
          path: dist/DeepSeek-Balance-macOS.zip
          if-no-files-found: error
